# Hook unit tests — nexus-memory plugin hooks
#
# Covers ALL THREE hooks and their tests:
#   - memory_capture.py   (UserPromptSubmit nudge, rules.json-driven)
#   - session_inject.py   (SessionStart warm-start injection, P2 / workflow A)
#   - session_capture.py  (SessionEnd activity capture, P1 / workflow C)
#
# The paths filter MUST cover every hook + its test + shared inputs so that
# editing any one of them triggers the gate. Omitting an input means silent
# escape: a bad edit would not rerun its tests
# (project lesson: feedback_ci_gate_trigger_must_cover_own_inputs).
#
# No bashisms used in any step — Forgejo runner defaults to POSIX sh -e {0}.
# If bashisms are ever needed, add `shell: bash` on that specific step.

name: hook-tests

on:
  push:
    paths:
      - hooks/rules.json
      - hooks/hooks.json
      - hooks/memory_capture.py
      - hooks/test_memory_capture.py
      - hooks/session_inject.py
      - hooks/test_session_inject.py
      - hooks/session_capture.py
      - hooks/test_session_capture.py
      - .forgejo/workflows/test.yml
  pull_request:
    paths:
      - hooks/rules.json
      - hooks/hooks.json
      - hooks/memory_capture.py
      - hooks/test_memory_capture.py
      - hooks/session_inject.py
      - hooks/test_session_inject.py
      - hooks/session_capture.py
      - hooks/test_session_capture.py
      - .forgejo/workflows/test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # node:20-bookworm (not python:*-slim): slim images lack git + node, so
      # the JS-based actions/checkout@v4 fails before tests run. This image has
      # git + node + python3 (3.11) — same proven image family as mirror.yml.
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hook unit tests
        run: |
          python3 hooks/test_memory_capture.py
          python3 hooks/test_session_inject.py
          python3 hooks/test_session_capture.py
